name: "Rebuild Data"
on:
  schedule:
    - cron: "33 17 * * 4" # every Thursday at 5:45PM UTC == 12:33PM EST
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - predtimechart-config.yml
      - predevals-config.yml
      - scripts/build_card_data.py
  workflow_dispatch:
    inputs:
      regenerate:
        description: "(Forecast) Regenerate previously-recorded model output data?"
        type: boolean
        required: false
        default: false
      data:
        description: "(Forecast) Which forecast page data should be built?"
        type: choice
        options:
          - 'target'
          - 'forecast'
          - 'both'
        required: false
        default: 'both'
      publish:
        description: "Push Data to branch (uncheck for a dry run)"
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  site:
    uses: hubverse-org/hub-dashboard-control-room/.github/workflows/generate-data.yaml@main
    with:
      owner: '${{ github.event.repository.owner.login }}'
      name: '${{ github.event.repository.name }}'
      slug: '${{ github.event.repository.owner.login }}'
      email: '${{ github.event.repository.owner.id }}+${{ github.event.repository.owner.login }}@users.noreply.github.com'
      regenerate: ${{ inputs.regenerate || false }}
      build: ${{ inputs.data || 'both' }}
      publish: ${{ inputs.publish || github.event_name == 'schedule' || github.event_name == 'push' }}
    secrets:
      id: 'none'
      key: ${{ secrets.GITHUB_TOKEN }}

  # Model-card data for forecast-prototype.qmd, built from the hub's sample trajectories and
  # published to the cards/data branch (the page reads it from there at view time).
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get hub repository name
        id: hub
        run: echo "repo=$(yq '.hub' site-config.yml)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.hub.outputs.repo }}
          path: hub
      - uses: astral-sh/setup-uv@v6
      - name: Build card data
        run: uv run scripts/build_card_data.py --hub hub --out out
      - name: Publish to cards/data branch
        if: ${{ inputs.publish || github.event_name == 'schedule' || github.event_name == 'push' }}
        working-directory: out
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b cards/data
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Update model card data for $(jq -r .reference_date options.json)"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" cards/data
